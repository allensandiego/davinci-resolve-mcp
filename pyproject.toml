[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-resolve-mcp"
version = "0.1.0"
description = "MCP server and file-polling bridge for DaVinci Resolve (Free and Studio)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
davinci-resolve-mcp = "davinci_resolve_mcp.server:main"
resolve-cli = "davinci_resolve_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
